<script type="application/json" id="otd-data">[{"d":"2026-10-05","t":"learning","s":"2026-10-05-learning","p":"perhaps i am not leaving much of a trail for myself"},{"d":"2026-10-01","t":"The King of Dust","s":"2026-10-01-the-king-of-dust","p":"Now that I have received my gifts, I must unwrap them, I unravel and they are gifts no more, but things to be lost.\r\nKing Midas had a touch which poisoned every thought with a lick of genius. What if he had a touch of di"},{"d":"2023-11-18","t":"Fleeting Footprints of Deceit","s":"2023-11-18-fleeting-footprints-of-deceit","p":"It’s the lies that hurt the most.\r\nPink shards, golden strings\r\nThey were no more than tracks in the snow"}]</script></main>
<footer class="site">Written slowly, kept quietly.</footer>
<script>(function () {
  var all = JSON.parse(document.getElementById("otd-data").textContent)
  var now = new Date()
  var md = function (d) { return d.slice(5) }
  var pad = function (n) { return String(n).padStart(2, "0") }
  var today = pad(now.getMonth() + 1) + "-" + pad(now.getDate())
  var thisYear = now.getFullYear()
  document.getElementById("otd-date").textContent = now.toLocaleDateString("en-US", { month: "long", day: "numeric" })
  var hits = all.filter(function (e) { return md(e.d) === today && Number(e.d.slice(0, 4)) < thisYear })
  var lede = hits.length ? "Written on this date in earlier years." : ""
  if (!hits.length) {
    // nothing on the day itself: the nearest dates within a week, any year
    var dist = function (e) {
      var d = new Date(thisYear, Number(e.d.slice(5, 7)) - 1, Number(e.d.slice(8, 10)))
      return Math.abs(Math.round((d - new Date(thisYear, now.getMonth(), now.getDate())) / 864e5))
    }
    var todayIso = thisYear + "-" + today
    hits = all
      .filter(function (e) { return e.d < todayIso && dist(e) <= 7 })
      .sort(function (a, b) { return dist(a) - dist(b) })
    lede = hits.length ? "Nothing on this exact date, so here are the closest days." : "Nothing was written around this date yet. Come back another day."
  }
  document.getElementById("otd-lede").textContent = lede
  var list = document.getElementById("otd")
  hits.forEach(function (e) {
    var li = document.createElement("li")
    var years = thisYear - Number(e.d.slice(0, 4))
    var when = new Date(e.d + "T00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })
    li.innerHTML = '<p class="when"></p><a class="q"></a><p class="from"></p>'
    li.querySelector(".when").textContent = (years > 0 ? years + (years === 1 ? " year ago · " : " years ago · ") : "") + when
    li.querySelector("a").textContent = e.t
    li.querySelector("a").href = "entries/" + e.s + ".html"
    li.querySelector(".from").textContent = e.p + (e.p.length >= 220 ? "…" : "")
    list.appendChild(li)
  })
})()</script>
