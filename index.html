ing them\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvriqyr009ml3qg7eccbez8\",\"quote\":\"I think my mother dismisses things too quickly\",\"category\":\"Question\",\"manual\":false},{\"id\":\"cmuvriqyr009nl3qg41orxrrx\",\"quote\":\"I try to write down all my thoughts in fear of losing them despite the knowledge that most of it is already gone\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yy001ol3qgt16jjo1m\",\"title\":\"Testing the Waters of Love\",\"content\":\"When he says I love you, I know he’s testing the waters to see if I’ll say it back\",\"date\":\"$D2024-05-09T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvri7nd009kl3qgmmyc5ktp\",\"quote\":\"When he says I love you, I know he’s testing the waters to see if I’ll say it back\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yy001nl3qggqvp0uai\",\"title\":\"Embracing restraint\",\"content\":\"Something to be said for abstaining from things so that you won’t ruin the little moments you have to enjoy it?\",\"date\":\"$D2024-05-06T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvri0ak009jl3qgsrp9c75y\",\"quote\":\"Something to be said for abstaining from things so that you won’t ruin the little moments you have to enjoy it?\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yy001kl3qgecon456k\",\"title\":\"Seeing through others eyes\",\"content\":\"I wish I could see myself from other peoples eyes. Not just in conversations but all the time. I wonder if I would like myself.\\r\\nI wish I wrote down everything that ib ever wanted to. All the implylsive thoughts, every emotion that I’ve felt. It all disappears so quickly?\",\"date\":\"$D2024-02-27T05:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrgqpn0099l3qguzyy60sz\",\"quote\":\"I wish I could see myself from other peoples eyes. Not just in conversations but all the time.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrgqpn009al3qg6i0quykv\",\"quote\":\"I wonder if I would like myself.\",\"category\":\"Question\",\"manual\":false},{\"id\":\"cmuvrgqpn009bl3qg6vo14grd\",\"quote\":\"I wish I wrote down everything that ib ever wanted to. All the implylsive thoughts, every emotion that I’ve felt. It all disappears so quickly?\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yx001gl3qgh7n65ueq\",\"title\":\"Fleeting Footprints of Deceit\",\"content\":\"It’s the lies that hurt the most.\\r\\nPink shards, golden strings\\r\\nThey were no more than tracks in the snow\",\"date\":\"$D2023-11-18T05:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrezsi0093l3qg0f4fipqo\",\"quote\":\"It’s the lies that hurt the most.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrezsi0094l3qgc9dux8ba\",\"quote\":\"Pink shards, golden strings\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrezsi0095l3qghx76ofpq\",\"quote\":\"They were no more than tracks in the snow\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yx001dl3qgvhgbhzlr\",\"title\":\"Rainy Days Linger\",\"content\":\"And outside, the rain fell harder\",\"date\":\"$D2023-08-12T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrdfu2008yl3qg1j7hbeuq\",\"quote\":\"And outside, the rain fell harder\",\"category\":\"Emotion\",\"manual\":false}]},{\"id\":\"cmuvqw9yx001bl3qgfs3kno7h\",\"title\":\"Lost in the Haze\",\"content\":\"Isn’t it funny? It seems like it was only yesterday…I was the shit. The center, in the middle. When did everyone else get ahead? \\r\\nBut the more I think I guess I never had it. Well at least it’s a much more comforting thought. I never had anyone FaceTime me at 2 in the morning to talk.\\r\\nI thought I needed someone to tell all my secrets to but I need someone that would tell me all their secrets.\",\"date\":\"$D2023-08-04T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrcoz4008ul3qg2rcml906\",\"quote\":\"I never had anyone FaceTime me at 2 in the morning to talk.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrcoz4008vl3qguchcq03g\",\"quote\":\"But the more I think I guess I never had it. Well at least it’s a much more comforting thought.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrcoz4008wl3qghudiypxv\",\"quote\":\"I thought I needed someone to tell all my secrets to but I need someone that would tell me all their secrets.\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yx001al3qg2vue05is\",\"title\":\"The Weight of Forgetting\",\"content\":\"Sometimes I really don’t know why. It comes back to the forgetting thing.\\r\\nWe’re all so lonely but so easily turn away comfort. It all takes too much energy. It’s so easy to feel sorry for yourself. Maybe it’s the way you’re meant to be.\",\"date\":\"$D2023-07-18T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrc7tx008rl3qgamby0k9p\",\"quote\":\"We’re all so lonely but so easily turn away comfort.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrc7tx008sl3qgxuoeh9ow\",\"quote\":\"It’s so easy to feel sorry for yourself.\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrc7tx008tl3qguk0qdumm\",\"quote\":\"Maybe it’s the way you’re meant to be.\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yw0018l3qguriglun3\",\"title\":\"Facing My Fears\",\"content\":\"There’s nothing that I truly run away from. That’s such a blessing, isn’t it?\",\"date\":\"$D2023-06-29T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrbjpi008ml3qgn0hb0v8c\",\"quote\":\"That’s such a blessing, isn’t it?\",\"category\":\"Insight\",\"manual\":false},{\"id\":\"cmuvrbjpi008nl3qgzlg033e6\",\"quote\":\"There’s nothing that I truly run away from.\",\"category\":\"Insight\",\"manual\":false}]},{\"id\":\"cmuvqw9yw0017l3qgxrso8xah\",\"title\":\"Love's Unseen Balance\",\"content\":\"“They love you a hundred times more than you love them.”\",\"date\":\"$D2023-06-24T04:00:00.000Z\",\"ownCategory\":\"\",\"quotes\":[{\"id\":\"cmuvrbauj008ll3qg275ccmyl\",\"quote\":\"They love you a hundred times more than you love them.\",\"category\":\"Insight\",\"manual\":false}]}],\"duplicates\":[],\"questions\":[{\"id\":\"cmuw24v23000lwoqgp0kqu14h\",\"quote\":\"perhaps i am not leaving much of a trail for myself\",\"kind\":\"wondering\",\"hidden\":false,\"noteId\":\"cmuw24v1q000kwoqg1kge5i2z\",\"noteTitle\":\"learning\",\"date\":\"2026-10-05T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa1g0061l3qgvq4ujz6q\",\"quote\":\"What if he had a touch of dirt?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9z2002cl3qged66z220\",\"noteTitle\":\"The King of Dust\",\"date\":\"2026-10-01T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa14005bl3qgheae82ci\",\"quote\":\"I do not know when he began to feel awkward around me.\",\"kind\":\"wondering\",\"hidden\":false,\"noteId\":\"cmuvqw9z00022l3qg2vcxwhep\",\"noteTitle\":\"The Unseen Shift\",\"date\":\"2026-03-07T05:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa130059l3qgcmwjirg8\",\"quote\":\"Are all successful people delusional?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yz001yl3qghvss1pdj\",\"noteTitle\":\"The Delusion of Certainty\",\"date\":\"2026-02-13T05:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa13005al3qg6g0qbq5x\",\"quote\":\"And yet…perhaps it takes the most ego of all to deny all other pathways and ideas to believe that one does not exist at all.\",\"kind\":\"wondering\",\"hidden\":false,\"noteId\":\"cmuvqw9yz001yl3qghvss1pdj\",\"noteTitle\":\"The Delusion of Certainty\",\"date\":\"2026-02-13T05:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0x004ql3qg26htvhcl\",\"quote\":\"Have I given them enough memories for them to give away all the potential?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0x004rl3qgu5b9obke\",\"quote\":\"But perhaps the question should be what memorie  degrading?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y004zl3qg84g3ryq0\",\"quote\":\"Why is thought not transferable?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y0050l3qg8wpmqime\",\"quote\":\"Or maybe we are conditioned to read wrong\",\"kind\":\"wondering\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y0051l3qgj9hziy04\",\"quote\":\"When did I stop seeing the possibilities, the excitement of potential?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y0052l3qgx4xxq7w6\",\"quote\":\"Ideas like golden drops drops of Jupiter?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y0053l3qgxaep6rpn\",\"quote\":\"Maybe intervention: moral obligation because if not then you keep going down that path, but I intervention even possible if the path is already laid out?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0y0054l3qg1t26pgjh\",\"quote\":\"But for sure someBecause where does the impetus to diverge come from?\",\"kind\":\"question\",\"hidden\":false,\"noteId\":\"cmuvqw9yy001sl3qgtn26vrv2\",\"noteTitle\":\"The Weight of Memories\",\"date\":\"2025-06-06T04:00:00.000Z\",\"replies\":[]},{\"id\":\"cmuvqwa0t004ol3qgykzpa3d7\
